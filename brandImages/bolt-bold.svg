<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="boltFat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d9f5"/>
      <stop offset="30%" stop-color="#8833ff"/>
      <stop offset="65%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ff1ab3"/>
    </linearGradient>
    <linearGradient id="bgFat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1120"/>
      <stop offset="100%" stop-color="#060a16"/>
    </linearGradient>
    <filter id="fatGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fatOuter">
      <feGaussianBlur stdDeviation="26" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="80" fill="url(#bgFat)"/>

  <!-- Extra outer glow for drama -->
  <path d="M300 42 L140 278 L224 278 L172 470 L380 218 L292 218 Z"
        fill="#8833ff" filter="url(#fatOuter)" opacity="0.6"/>

  <!-- Bold chunky bolt — wider proportions -->
  <path d="M300 42 L140 278 L224 278 L172 470 L380 218 L292 218 Z"
        fill="url(#boltFat)" filter="url(#fatGlow)"/>

  <!-- Bright inner highlight wedge -->
  <path d="M296 75 L222 232 L262 232 L270 210 Z"
        fill="rgba(255,255,255,0.18)"/>

  <!-- Edge stroke -->
  <path d="M300 42 L140 278 L224 278 L172 470 L380 218 L292 218 Z"
        fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Speed lines left — 4 lines, more dramatic -->
  <line x1="28" y1="170" x2="112" y2="170" stroke="#00d9f5" stroke-width="4" stroke-linecap="round" opacity="0.7" filter="url(#fatGlow)"/>
  <line x1="18" y1="202" x2="104" y2="202" stroke="#00d9f5" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="26" y1="232" x2="108" y2="232" stroke="#00d9f5" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="34" y1="260" x2="112" y2="260" stroke="#00d9f5" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>

  <!-- Speed lines right — 4 lines -->
  <line x1="400" y1="285" x2="486" y2="285" stroke="#ff1ab3" stroke-width="4" stroke-linecap="round" opacity="0.7" filter="url(#fatGlow)"/>
  <line x1="408" y1="315" x2="492" y2="315" stroke="#ff1ab3" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="402" y1="344" x2="484" y2="344" stroke="#ff1ab3" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="408" y1="372" x2="486" y2="372" stroke="#ff1ab3" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>
</svg>
